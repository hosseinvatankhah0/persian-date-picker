<div class="persian-date-picker-wrapper" [class.disabled]="disabled">
  <ng-container *ngIf="pickerType === 'modal'">
    <dp-date-picker-modal
        (ngModelChange)="onModelChange($event)"
        [config]="config"
        [disabled]="disabled"
        [maxDate]="normalizedMaxDate"
        [maxTime]="maxTime"
        [minDate]="normalizedMinDate"
        [minTime]="minTime"
        [mode]="mode"
        [selectionMode]="selectionMode"
        [fontSize]="fontSize"
        [ngModel]="pickerValue"
        [ngModelOptions]="standaloneNgModelOptions"
        [placeholder]="placeholder"
        [required]="required"
        class="custom-date-picker"
        dir="ltr"
        theme="dp-material">
   </dp-date-picker-modal>
    <button *ngIf="hasValue"
        type="button"
        class="remove-icon"
        [attr.aria-label]="locale === 'fa' ? 'پاک کردن تاریخ' : 'Clear date'"
        [class.disabled]="disabled"
        [disabled]="disabled"
        (click)="clearDate($event)">
      <i class="far fa-times" aria-hidden="true"></i>
   </button>
 </ng-container>

  <ng-container *ngIf="pickerType === 'inline'">
    <dp-date-picker-modal
        (ngModelChange)="onModelChange($event)"
        [config]="inlineConfig"
        [disabled]="disabled"
        [maxDate]="normalizedMaxDate"
        [maxTime]="maxTime"
        [minDate]="normalizedMinDate"
        [minTime]="minTime"
        [mode]="mode"
        [selectionMode]="selectionMode"
        [fontSize]="fontSize"
        [ngModel]="pickerValue"
        [ngModelOptions]="standaloneNgModelOptions"
        [placeholder]="placeholder"
        [required]="required"
        class="custom-date-picker inline-picker"
        dir="ltr"
        theme="dp-material">
   </dp-date-picker-modal>
    <button *ngIf="hasValue"
        type="button"
        class="remove-icon inline-remove"
        [attr.aria-label]="locale === 'fa' ? 'پاک کردن تاریخ' : 'Clear date'"
        [class.disabled]="disabled"
        [disabled]="disabled"
        (click)="clearDate($event)">
      <i class="far fa-times" aria-hidden="true"></i>
   </button>
 </ng-container>
</div>

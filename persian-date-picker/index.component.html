<div class="persian-date-picker-wrapper" [class.disabled]="disabled" [class.has-calendar-icon]="showCalendarIcon">
  <ng-container *ngIf="pickerType === 'modal'">
    <dp-date-picker-modal
        (ngModelChange)="onModelChange($event)"
        [config]="config"
        [disabled]="disabled"
        [maxDate]="normalizedMaxDate"
        [maxTime]="maxTime"
        [minDate]="normalizedMinDate"
        [minTime]="minTime"
        [mode]="mode"
        [selectionMode]="selectionMode"
        [fontSize]="fontSize"
        [showCalendarIcon]="showCalendarIcon"
        [ngModel]="pickerValue"
        [ngModelOptions]="standaloneNgModelOptions"
        [placeholder]="placeholder"
        [required]="required"
        class="custom-date-picker"
        dir="ltr"
        theme="dp-default">
   </dp-date-picker-modal>
    <button *ngIf="hasValue"
        type="button"
        class="remove-icon"
        [attr.aria-label]="locale === 'fa' ? 'پاک کردن تاریخ' : 'Clear date'"
        [class.disabled]="disabled"
        [disabled]="disabled"
        (click)="clearDate($event)">
      <svg class="remove-icon-glyph" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
   </button>
 </ng-container>

  <ng-container *ngIf="pickerType === 'inline'">
    <dp-date-picker-modal
        (ngModelChange)="onModelChange($event)"
        [config]="inlineConfig"
        [disabled]="disabled"
        [maxDate]="normalizedMaxDate"
        [maxTime]="maxTime"
        [minDate]="normalizedMinDate"
        [minTime]="minTime"
        [mode]="mode"
        [selectionMode]="selectionMode"
        [fontSize]="fontSize"
        [showCalendarIcon]="showCalendarIcon"
        [ngModel]="pickerValue"
        [ngModelOptions]="standaloneNgModelOptions"
        [placeholder]="placeholder"
        [required]="required"
        class="custom-date-picker inline-picker"
        dir="ltr"
        theme="dp-default">
   </dp-date-picker-modal>
    <button *ngIf="hasValue"
        type="button"
        class="remove-icon"
        [attr.aria-label]="locale === 'fa' ? 'پاک کردن تاریخ' : 'Clear date'"
        [class.disabled]="disabled"
        [disabled]="disabled"
        (click)="clearDate($event)">
      <svg class="remove-icon-glyph" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
   </button>
 </ng-container>
</div>

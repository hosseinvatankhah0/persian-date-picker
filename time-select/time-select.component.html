<div class="dp-time-select-controls" role="group"
     [attr.aria-label]="isFarsi ? 'انتخاب زمان' : 'Select time'">
  <div class="dp-time-select-control dp-time-select-control-hours">
    <button (click)="increase('hour')"
            [attr.aria-label]="isFarsi ? 'افزایش ساعت' : 'Increase hours'"
            [disabled]="!showIncHour"
            class="dp-time-select-control-up"
            type="button">
    </button>
    <span [innerText]="hours"
          aria-live="polite"
          class="dp-time-select-display dp-time-select-display-hours">
    </span>
    <button (click)="decrease('hour')"
            [attr.aria-label]="isFarsi ? 'کاهش ساعت' : 'Decrease hours'"
            [disabled]="!showDecHour"
            class="dp-time-select-control-down"
            type="button"></button>
    <span class="dp-time-select-label">{{ isFarsi ? 'ساعت' : 'hr' }}</span>
  </div>

  <span [innerText]="componentConfig.timeSeparator"
        aria-hidden="true"
        class="dp-time-select-separator">
  </span>

  <div class="dp-time-select-control dp-time-select-control-minutes">
    <button (click)="increase('minute')"
            [attr.aria-label]="isFarsi ? 'افزایش دقیقه' : 'Increase minutes'"
            [disabled]="!showIncMinute"
            class="dp-time-select-control-up"
            type="button"></button>
    <span [innerText]="minutes"
          aria-live="polite"
          class="dp-time-select-display dp-time-select-display-minutes">
    </span>
    <button (click)="decrease('minute')"
            [attr.aria-label]="isFarsi ? 'کاهش دقیقه' : 'Decrease minutes'"
            [disabled]="!showDecMinute"
            class="dp-time-select-control-down"
            type="button"></button>
    <span class="dp-time-select-label">{{ isFarsi ? 'دقیقه' : 'min' }}</span>
  </div>

  @if (componentConfig.showSeconds) {
    <span [innerText]="componentConfig.timeSeparator"
          aria-hidden="true"
          class="dp-time-select-separator">
    </span>
    <div class="dp-time-select-control dp-time-select-control-seconds">
      <button (click)="increase('second')"
              [attr.aria-label]="isFarsi ? 'افزایش ثانیه' : 'Increase seconds'"
              [disabled]="!showIncSecond"
              class="dp-time-select-control-up"
              type="button"></button>
      <span [innerText]="seconds"
            aria-live="polite"
            class="dp-time-select-display dp-time-select-display-seconds">
      </span>
      <button (click)="decrease('second')"
              [attr.aria-label]="isFarsi ? 'کاهش ثانیه' : 'Decrease seconds'"
              [disabled]="!showDecSecond"
              class="dp-time-select-control-down"
              type="button"></button>
      <span class="dp-time-select-label">{{ isFarsi ? 'ثانیه' : 'sec' }}</span>
    </div>
  }

  @if (!componentConfig.showTwentyFourHours) {
    <div class="dp-time-select-control dp-time-select-control-meridiem">
      <button (click)="toggleMeridiem()"
              [attr.aria-label]="isFarsi ? 'تغییر قبل/بعد از ظهر' : 'Toggle meridiem'"
              [disabled]="!showToggleMeridiem"
              class="dp-time-select-control-up"
              type="button"></button>
      <span [innerText]="meridiem"
            aria-live="polite"
            class="dp-time-select-display dp-time-select-display-meridiem">
      </span>
      <button (click)="toggleMeridiem()"
              [attr.aria-label]="isFarsi ? 'تغییر قبل/بعد از ظهر' : 'Toggle meridiem'"
              [disabled]="!showToggleMeridiem"
              class="dp-time-select-control-down"
              type="button"></button>
      <span class="dp-time-select-label">&nbsp;</span>
    </div>
  }
</div>
